name: Import Xian Man Lou menu photos to GitHub
on:
  push:
    branches: [merchant-websites]
    paths: ['.github/workflows/xianmanlou-import.yml']
permissions:
  contents: write
jobs:
  import-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: merchant-websites
          persist-credentials: true
      - name: Transfer original ten supplied menu photos into repository
        shell: bash
        run: |
          set -euo pipefail
          OUT="merchant-websites/xianmanlou/assets/original-menu"
          mkdir -p "$OUT"
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 60 'https://d2ol7oe51mr4n9.cloudfront.net/user_3Jb85Thbp6wwOYRd5nIaoln4p3W/0cf3a7a4-28ce-47e8-8c5b-97b8deac256d.jpg' -o "$OUT/menu-page-01.jpg"
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 60 'https://d2ol7oe51mr4n9.cloudfront.net/user_3Jb85Thbp6wwOYRd5nIaoln4p3W/aa504b7c-1f37-41b4-b1a6-326758b3465c.jpg' -o "$OUT/menu-page-02.jpg"
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 60 'https://d2ol7oe51mr4n9.cloudfront.net/user_3Jb85Thbp6wwOYRd5nIaoln4p3W/dc470d93-6d9b-4407-8ffb-ae00cdc47d4e.jpg' -o "$OUT/menu-page-03.jpg"
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 60 'https://d2ol7oe51mr4n9.cloudfront.net/user_3Jb85Thbp6wwOYRd5nIaoln4p3W/842d7208-5eb4-436b-bc1f-8b5bf1687a33.jpg' -o "$OUT/menu-page-04.jpg"
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 60 'https://d2ol7oe51mr4n9.cloudfront.net/user_3Jb85Thbp6wwOYRd5nIaoln4p3W/2d41b6b1-0f76-445c-99b9-f22f27c27998.jpg' -o "$OUT/menu-page-05.jpg"
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 60 'https://d2ol7oe51mr4n9.cloudfront.net/user_3Jb85Thbp6wwOYRd5nIaoln4p3W/60adfd9b-0abd-4177-9bdb-cf16b0bfad66.jpg' -o "$OUT/menu-page-06.jpg"
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 60 'https://d2ol7oe51mr4n9.cloudfront.net/user_3Jb85Thbp6wwOYRd5nIaoln4p3W/76c0663b-37d9-4fe8-8aea-4cac67d7f0b8.jpg' -o "$OUT/menu-page-07.jpg"
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 60 'https://d2ol7oe51mr4n9.cloudfront.net/user_3Jb85Thbp6wwOYRd5nIaoln4p3W/74b22fc3-c678-474f-abf4-4fb4f097a979.jpg' -o "$OUT/menu-page-08.jpg"
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 60 'https://d2ol7oe51mr4n9.cloudfront.net/user_3Jb85Thbp6wwOYRd5nIaoln4p3W/e2f8660e-6aa9-4197-b78d-6ff7d3078da5.jpg' -o "$OUT/menu-page-09.jpg"
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 60 'https://d2ol7oe51mr4n9.cloudfront.net/user_3Jb85Thbp6wwOYRd5nIaoln4p3W/384c8f04-9eab-4e58-865f-c497f6767f3a.jpg' -o "$OUT/menu-page-10.jpg"
          for image in "$OUT"/menu-page-*.jpg; do
            test "$(stat -c %s "$image")" -gt 50000
            test "$(head -c 3 "$image" | od -An -tx1 | tr -d ' \n')" = "ffd8ff"
          done
          test "$(find "$OUT" -maxdepth 1 -name 'menu-page-*.jpg' | wc -l)" -eq 10
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git diff --cached --quiet || { git commit -m "assets: import 10 original Xian Man Lou menu photos" && git push; }
